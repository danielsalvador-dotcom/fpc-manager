<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>FPC Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#030c28;--s1:#07112e;--s2:#0c1a48;--s3:#122060;
  --border:#1c3282;--border2:#2a4aa0;
  --gold:#c9a227;--goldb:#f0cc3a;
  --cream:#ede7d0;--steel:#6888c8;--muted:#4a6098;
  --danger:#e04848;--success:#3ab86a;--info:#4888e0;--warn:#d08820;
  --fs:'Playfair Display',serif;--fn:'DM Sans',sans-serif;--fm:'Space Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--fn);overflow:hidden;-webkit-text-size-adjust:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}

/* ─── HOME ─── */
#home{background:linear-gradient(160deg,#050e32,#030c28 60%,#05142a);align-items:center;overflow-y:auto}
.home-inner{width:100%;max-width:480px;margin:0 auto;padding:36px 20px 100px;display:flex;flex-direction:column;align-items:center}
.home-logo-wrap{width:200px;height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}.home-logo-wrap img{width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 0 18px #c9a22788) drop-shadow(0 0 40px #c9a22744)}
.home-logo-wrap img{width:100%;height:100%;object-fit:cover;object-position:50% 32%}
.home-brand{font-family:var(--fs);font-size:26px;font-weight:900;color:var(--gold);letter-spacing:4px;margin-bottom:2px}
.home-sub{font-size:11px;color:var(--steel);letter-spacing:4px;text-transform:uppercase;margin-bottom:32px}
.home-dealer-wrap{width:100%;margin-bottom:26px}
.home-dealer-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px}
.home-dealer-input{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--cream);border-radius:10px;padding:13px 14px;font-size:15px;font-family:var(--fn);outline:none}
.home-dealer-input:focus{border-color:var(--gold)}
.section-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;align-self:flex-start}
#trn-list{width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.trn-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:15px;display:flex;align-items:center;gap:14px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background .15s}
.trn-card:active{background:var(--s2)}
.trn-chip{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--s3),var(--s2));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--fs);font-weight:900;color:var(--gold);font-size:16px;flex-shrink:0}
.trn-info{flex:1;min-width:0}
.trn-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trn-meta{font-size:12px;color:var(--muted);margin-top:2px}
.trn-del{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:4px 8px;opacity:.6}
.btn-new{width:100%;background:linear-gradient(135deg,var(--gold),#a07a18);color:#000;border:none;border-radius:14px;padding:17px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--fn);box-shadow:0 4px 20px #c9a22755}
.home-empty{color:var(--muted);font-size:14px;padding:22px;text-align:center}

/* ─── APP ─── */
#app{background:var(--bg)}
.app-header{background:var(--s1);border-bottom:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top))}
.hdr-back{background:none;border:1px solid var(--border);color:var(--steel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;line-height:1}
.hdr-logo-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hdr-logo-wrap svg{flex-shrink:0}
.hdr-title{font-family:var(--fs);font-size:14px;font-weight:900;color:var(--gold);letter-spacing:1px;white-space:nowrap}
.hdr-sub{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-export{background:none;border:1px solid var(--border);color:var(--steel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0}
#tab-content{flex:1;overflow-y:auto;padding-bottom:70px;-webkit-overflow-scrolling:touch}

/* ─── NAV ─── */
.bot-nav{position:absolute;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;background:none;border:none;color:var(--muted);padding:7px 1px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:2px solid transparent;transition:all .15s;-webkit-user-select:none;user-select:none}
.tab-btn.active{color:var(--gold);border-top-color:var(--gold)}
.tab-btn .ico{font-size:15px}
.tab-btn .lbl{font-size:8px;font-weight:600;letter-spacing:.3px}

/* ─── COMMON ─── */
.pad{padding:16px}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px}
.sc-title{font-family:var(--fs);font-size:16px;color:var(--gold);margin-bottom:14px}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px}
.fi{background:var(--s2);border:1px solid var(--border);color:var(--cream);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--fn);outline:none;width:100%}
.fi:focus{border-color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a07a18);color:#000;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--fn)}
.btn-ghost{background:var(--s2);color:var(--cream);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer;font-family:var(--fn)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid transparent;-webkit-user-select:none;user-select:none}
.ts{background:#3ab86a22;color:var(--success);border-color:#3ab86a44}
.td{background:#e0484822;color:var(--danger);border-color:#e0484844}
.ti{background:#4888e022;color:var(--info);border-color:#4888e044}
.tw{background:#d0882022;color:var(--warn);border-color:#d0882044}
.tm{background:var(--s2);color:var(--muted);border-color:var(--border)}
.div{height:1px;background:var(--border);margin:11px 0}
.sb{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.mono{font-family:var(--fm)}
.tg{color:var(--gold)}.ts2{color:var(--success)}.td2{color:var(--danger)}.tm2{color:var(--muted)}
.bal{display:flex;justify-content:space-between;align-items:center;padding:13px;border-radius:12px;margin-top:8px}
.bal.pos{background:#3ab86a22;border:1px solid #3ab86a44}
.bal.neg{background:#e0484822;border:1px solid #e0484844}

/* ─── TIMER ─── */
#tw{display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:18px}
.t-title{font-family:var(--fs);font-size:16px;color:var(--gold);letter-spacing:3px}
.t-wrap{position:relative;width:220px;height:220px}
.t-disp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.t-num{font-family:var(--fm);font-size:76px;font-weight:700;line-height:1;letter-spacing:-4px;transition:color .3s}
.t-hint{font-size:11px;color:var(--muted);margin-top:6px}
.t-ctrl{display:flex;gap:10px;width:100%}
.btn-go{flex:2;border:none;border-radius:14px;padding:18px;font-size:17px;font-weight:700;cursor:pointer;color:#fff;background:var(--success);box-shadow:0 0 20px #3ab86a44;transition:background .2s,box-shadow .2s}
.btn-go.on{background:var(--danger);box-shadow:0 0 20px #e0484844}
.btn-rst{flex:1;background:var(--s2);color:var(--cream);border:1px solid var(--border);border-radius:14px;padding:18px;font-size:22px;cursor:pointer}
.atr{display:flex;gap:8px;width:100%}
.atb{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--cream);border-radius:10px;padding:11px 4px;font-size:13px;font-weight:700;cursor:pointer}

/* ─── REBUY ─── */
.pc{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px}
.pc.elim{opacity:.6;border-color:#e0484844}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.pn{font-weight:700;font-size:15px;flex:1}
.rr{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rc{flex:1;font-size:13px;color:var(--muted)}
.rc span{color:var(--cream);font-family:var(--fm);font-size:18px;font-weight:700}
.ar{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.hb{position:relative;border:none;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--fn);-webkit-user-select:none;user-select:none;touch-action:none}
.hbg{position:absolute;top:-8px;right:-8px;background:var(--goldb);color:#000;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--fm);z-index:5;pointer-events:none}

/* ─── BEST HAND ─── */
.bh-box{background:linear-gradient(135deg,#c9a22720,#c9a22708);border:2px solid var(--gold);border-radius:16px;padding:18px;margin-bottom:16px;position:relative}
.bh-clear{position:absolute;top:12px;right:12px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px;font-family:var(--fn)}

/* ─── PREDATOR ─── */
.ppg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ppb{background:var(--s2);border:1px solid var(--border);color:var(--cream);border-radius:10px;padding:12px 8px;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;font-family:var(--fn)}
.ps2r{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:8px}
.kb{background:#e0484822;border:1px solid #e0484855;color:var(--danger);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:13px;font-family:var(--fn)}
.plr{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}

/* ─── RANKING ─── */
.rkb{background:var(--s2);border:1px solid var(--border);color:var(--cream);border-radius:12px;padding:14px 10px;cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;width:100%;font-family:var(--fn)}
.rkr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.rkm{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;border:1px solid var(--border)}

/* ─── CONSUMPTION ─── */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.di{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:6px}
.db{border:none;border-radius:5px;width:28px;height:22px;cursor:pointer;font-weight:700;font-size:14px}
.dbp{background:#3ab86a44;color:var(--success)}
.dbm{background:#e0484822;color:var(--danger)}
.item-edit-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}

/* ─── SETTINGS ─── */
.str{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.str.cur{border-color:var(--gold);background:#c9a22712;cursor:default}
.stri{flex:1;min-width:0}

/* ─── MODAL ─── */
#modal-bg{position:fixed;inset:0;background:#00000088;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--s1);border:1px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--fs);font-size:20px;color:var(--gold);margin-bottom:20px}
.mf{margin-bottom:14px}
.mac{display:flex;gap:10px;margin-top:20px}

/* ─── EXPORT ─── */
#exp-bg{position:fixed;inset:0;background:#00000088;z-index:1001;display:flex;align-items:flex-end}
.exp-box{background:var(--s1);border-top:1px solid var(--border2);border-radius:20px 20px 0 0;padding:24px;width:100%;max-height:80vh;overflow-y:auto}
.exp-txt{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px;font-family:var(--fm);font-size:11px;color:var(--cream);white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow-y:auto;margin:12px 0}
.bts{font-size:10px;color:var(--muted);font-family:var(--fm);flex-shrink:0}
</style>
</head>

<script>
// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
var HANDS = ['Royal Flush','Straight Flush','Quadra','Full House','Flush','Sequ\u00eancia','Trinca','Dois Pares','Par'];
var RANKS = ['A','K','Q','J','10','9','8','7','6','5','4','3','2'];
var AV = ['#1a4a8a','#1a6a3a','#6a1a4a','#4a3a1a','#1a3a6a','#5a1a1a','#1a5a5a','#4a1a6a'];
var DEF_ITEMS = [
  {id:1, e:'\ud83c\udf7a', n:'Cerveja', p:8},
  {id:2, e:'\u26a1', n:'Energ\u00e9tico', p:15},
  {id:3, e:'\ud83d\udca7', n:'\u00c1gua', p:4},
  {id:4, e:'\ud83e\udd64', n:'Refrigerante', p:6}
];

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
var S = {
  tournaments: {},
  activeId: null,
  tab: 0,
  dealerName: '',
  timer: {max:30, val:30, on:false, _iv:null}
};

// ═══════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════
function save() {
  try { localStorage.setItem('fpc6', JSON.stringify({t:S.tournaments, d:S.dealerName})); } catch(e) {}
}
function loadData() {
  try {
    var r = JSON.parse(localStorage.getItem('fpc6') || '{}');
    S.tournaments = r.t || {};
    S.dealerName = r.d || '';
  } catch(e) {}
}
function T() { return S.tournaments[S.activeId]; }

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function brl(n) { return 'R$ ' + ((+n||0).toFixed(2).replace('.',',')); }
function pad(n) { return String(Math.max(0,Math.floor(n))).padStart(2,'0'); }
function ts() { return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function avBg(id) { return AV[(id*3+7) % AV.length]; }
function ini(n) { return (n||'?')[0].toUpperCase(); }
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function beep(f,d,v) {
  try {
    var ac = new (window.AudioContext||window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = f||880; o.type = 'sine';
    g.gain.setValueAtTime(v||0.3, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+(d||0.4));
    o.start(); o.stop(ac.currentTime+(d||0.4));
  } catch(e) {}
}

// ═══════════════════════════════════════════
//  TOURNAMENT
// ═══════════════════════════════════════════
function newTournament(name,date,buyIn,rebuyCost,rebuyBonusCost,addonCost) {
  var id = uid();
  S.tournaments[id] = {
    id:id, name:name, date:date, createdAt:new Date().toISOString(),
    settings:{buyIn:+buyIn||100, rebuyCost:+rebuyCost||50, rebuyBonusCost:+rebuyBonusCost||80, addonCost:+addonCost||60},
    players:[], events:[], bestHand:null, ranking:[],
    items:JSON.parse(JSON.stringify(DEF_ITEMS)),
    financials:{prizes:'',costs:'',expenses:''},
    nextPid:1
  };
  save(); return id;
}
function deleteTournament(id) { delete S.tournaments[id]; save(); renderHome(); }
function logEvent(type,data) {
  if (!T()) return;
  T().events.push({id:uid(), type:type, data:data, ts:ts(), dealer:S.dealerName, at:Date.now()});
  save();
}

// ═══════════════════════════════════════════
//  PLAYERS
// ═══════════════════════════════════════════
function addPlayer(name) {
  if (!name.trim() || !T()) return;
  var id = T().nextPid++;
  T().players.push({
    id:id, name:name.trim(), buyInPaid:false,
    rebuys:{common:0,bonus:0}, rebuysPaid:{common:false,bonus:false},
    addon:false, addonPaid:false, eliminated:false, drinks:{}, drinksPaid:false
  });
  save();
}
function P(pid) { return T() ? T().players.find(function(p){return p.id===pid;}) : null; }
function upP(pid,fn) { var p=P(pid); if(p){fn(p);save();} }
function addRebuy(pid,type,n) {
  upP(pid,function(p){p.rebuys[type]+=n;});
  var pl=P(pid); logEvent('rebuy_'+type,{pid:pid, count:n, name:pl?pl.name:''});
}
function remRebuy(pid,type) { upP(pid,function(p){p.rebuys[type]=Math.max(0,p.rebuys[type]-1);}); }
function toggleBuyInPaid(pid) { upP(pid,function(p){p.buyInPaid=!p.buyInPaid;}); }
function toggleRebuysPaid(pid) {
  upP(pid,function(p){var all=p.rebuysPaid.common&&p.rebuysPaid.bonus;p.rebuysPaid.common=p.rebuysPaid.bonus=!all;});
}
function toggleAddon(pid) {
  upP(pid,function(p){p.addon=!p.addon;});
  var pl=P(pid); logEvent('addon',{pid:pid, name:pl?pl.name:'', taken:pl?pl.addon:false});
}
function toggleAddonPaid(pid) { upP(pid,function(p){p.addonPaid=!p.addonPaid;}); }
function toggleDrinksPaid(pid) { upP(pid,function(p){p.drinksPaid=!p.drinksPaid;}); }
function addDrink(pid,iid) { upP(pid,function(p){p.drinks[iid]=(p.drinks[iid]||0)+1;}); }
function remDrink(pid,iid) {
  upP(pid,function(p){var q=(p.drinks[iid]||0)-1;if(q<=0)delete p.drinks[iid];else p.drinks[iid]=q;});
}

// ═══════════════════════════════════════════
//  PREDATOR / RANKING
// ═══════════════════════════════════════════
function recordKill(predId,preyId) {
  var pred=P(predId), prey=P(preyId); if(!pred||!prey) return;
  logEvent('kill',{predId:predId, preyId:preyId, predName:pred.name, preyName:prey.name});
}
function finalEliminate(pid) {
  var t=T(); if(!t) return;
  var idx=t.ranking.indexOf(pid);
  if(idx>=0) {
    t.ranking.splice(idx,1);
    upP(pid,function(p){p.eliminated=false;});
  } else {
    t.ranking.push(pid);
    upP(pid,function(p){p.eliminated=true;});
    var pl=P(pid);
    logEvent('final_elim',{pid:pid, name:pl?pl.name:'', place:t.players.length-t.ranking.length+1});
  }
  save();
}

// ═══════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════
function timerTick() {
  S.timer.val--;
  if(S.timer.val<=0) {
    beep(880,.2,.4); setTimeout(function(){beep(1100,.2,.4);},280); setTimeout(function(){beep(880,.5,.5);},560);
    S.timer.val=S.timer.max;
  } else if(S.timer.val<=5) {
    beep(440,.08,.2);
  }
  updateTimerUI();
}
function startTimer() { S.timer.on=true; S.timer._iv=setInterval(timerTick,1000); }
function pauseTimer() { S.timer.on=false; clearInterval(S.timer._iv); }
function resetTimer() { pauseTimer(); S.timer.val=S.timer.max; updateTimerUI(); updateTimerBtn(); }
function toggleTimer() { if(S.timer.on) pauseTimer(); else startTimer(); updateTimerBtn(); }
function updateTimerUI() {
  var el=document.getElementById('timer-num'), arc=document.getElementById('timer-arc');
  if(!el) return;
  var clr=S.timer.val<=5?'var(--danger)':'var(--success)';
  el.style.color=clr; el.textContent=pad(S.timer.val);
  if(arc) {
    var r=96,c=2*Math.PI*r,pct=Math.min(1,S.timer.val/S.timer.max);
    arc.setAttribute('stroke-dashoffset', c*(1-pct));
    arc.setAttribute('stroke', clr);
  }
}
function updateTimerBtn() {
  var btn=document.getElementById('btn-go');
  if(!btn) return;
  btn.textContent=S.timer.on?'&#9208; Pausar':'&#9654; Iniciar';
  if(S.timer.on) btn.classList.add('on'); else btn.classList.remove('on');
}

// ═══════════════════════════════════════════
//  HOLD BUTTON
// ═══════════════════════════════════════════
function makeHold(el,onCommit) {
  var count=0, timer=null;
  var badge=el.querySelector('.hbg');
  if(!badge){badge=document.createElement('div');badge.className='hbg hidden';el.appendChild(badge);}
  function tick(){count++;badge.textContent=count;badge.classList.remove('hidden');}
  function start(e){e.preventDefault();count=0;tick();timer=setInterval(tick,700);}
  function end(){clearInterval(timer);badge.classList.add('hidden');if(count>0){onCommit(count);count=0;}}
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',end);
  el.addEventListener('mouseleave',end);
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
}

// ═══════════════════════════════════════════
function calcTotals() {
  var t=T(); if(!t) return {totBI:0,totRV:0,totAO:0,totDR:0,totRev:0,totRC:0,totRB:0};
  var cfg=t.settings,ps=t.players,its=t.items;
  var totBI=ps.filter(function(p){return p.buyInPaid;}).length*cfg.buyIn;
  var totRC=ps.reduce(function(s,p){return s+p.rebuys.common;},0);
  var totRB=ps.reduce(function(s,p){return s+p.rebuys.bonus;},0);
  var totRV=totRC*cfg.rebuyCost+totRB*cfg.rebuyBonusCost;
  var totAO=ps.filter(function(p){return p.addon&&p.addonPaid;}).length*cfg.addonCost;
  var totDR=ps.reduce(function(s,p){return s+its.reduce(function(ss,it){return ss+(p.drinks[it.id]||0)*it.p;},0);},0);
  return {totBI:totBI,totRC:totRC,totRB:totRB,totRV:totRV,totAO:totAO,totDR:totDR,totRev:totBI+totRV+totAO+totDR};
}
function plyrTotal(p) {
  var t=T(); if(!t) return 0;
  var cfg=t.settings,its=t.items;
  return cfg.buyIn+p.rebuys.common*cfg.rebuyCost+p.rebuys.bonus*cfg.rebuyBonusCost+(p.addon?cfg.addonCost:0)+its.reduce(function(s,it){return s+(p.drinks[it.id]||0)*it.p;},0);
}
function plyrPaid(p) {
  var t=T(); if(!t) return 0;
  var cfg=t.settings,its=t.items;
  return (p.buyInPaid?cfg.buyIn:0)+(p.rebuysPaid.common?p.rebuys.common*cfg.rebuyCost:0)+(p.rebuysPaid.bonus?p.rebuys.bonus*cfg.rebuyBonusCost:0)+(p.addonPaid?cfg.addonCost:0)+(p.drinksPaid?its.reduce(function(s,it){return s+(p.drinks[it.id]||0)*it.p;},0):0);
}
function refreshBal() {
  var t=T(); if(!t) return;

}

var predStep=null;
function renderPredator() {
  var t=T(); if(!t) return;
  var ps=t.players;
  var kills=t.events.filter(function(ev){return ev.type==='kill';});
  var counts={};
  kills.forEach(function(ev){counts[ev.data.predId]=(counts[ev.data.predId]||0)+1;});
  var sorted=ps.map(function(p){return {id:p.id,name:p.name,c:counts[p.id]||0};})
    .filter(function(p){return p.c>0;}).sort(function(a,b){return b.c-a.c;});
  var h='<div class="pad">';
  if(sorted.length){
    h+='<div class="sc"><div class="sc-title">&#128128; Predadores da Noite</div>';
    sorted.forEach(function(p,i){
      var bg=i===0?'var(--gold)':i===1?'#aaa':'#cd7f32';
      h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">';
      h+='<div style="width:30px;height:30px;border-radius:50%;background:'+bg+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#000">'+(i+1)+'</div>';
      h+='<span style="flex:1;font-weight:600">'+esc(p.name)+'</span>';
      h+='<span class="mono td2" style="font-size:22px;font-weight:700">'+p.c+'</span>';
      h+='<span style="font-size:11px;color:var(--muted)">kills</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="sc" id="pred-box"><div class="sc-title">&#9876; Registrar Kill</div>';
  h+=predStepHTML();
  h+='</div>';
  if(kills.length){
    h+='<div class="sc"><div class="sc-title">&#128203; Hist&#243;rico</div>';
    kills.slice().reverse().forEach(function(ev){
      h+='<div class="plr"><span style="flex:1"><span class="ts2" style="font-weight:700">'+esc(ev.data.predName)+'</span> <span class="tm2">eliminou</span> <span class="td2" style="font-weight:700">'+esc(ev.data.preyName)+'</span></span>';
      h+='<span class="bts">'+ev.ts+'</span>';
      h+='<button data-remkill="'+ev.id+'" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px">&#10005;</button></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('tab-content').innerHTML=h;
  wirePredator();
}
function predStepHTML() {
  var t=T(); if(!t) return '';
  var ps=t.players;
  if(!predStep){
    var h='<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Quem ganhou o all-in?</div><div class="ppg">';
    ps.forEach(function(p){
      h+='<button class="ppb" data-pred="'+p.id+'">';
      h+='<div class="av" style="background:'+avBg(p.id)+';width:26px;height:26px;font-size:11px">'+ini(p.name)+'</div>';
      h+=esc(p.name)+'</button>';
    });
    h+='</div>';
    return h;
  }
  var pred=P(predStep);
  var h='<div style="margin-bottom:12px;padding:8px 12px;background:var(--s2);border-radius:8px;font-size:13px">';
  h+='Predador: <strong class="tg">'+esc(pred?pred.name:'')+'</strong></div>';
  h+='<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Quem foi abatido?</div>';
  ps.filter(function(p){return p.id!==predStep;}).forEach(function(p){
    h+='<div class="ps2r">';
    h+='<div class="av" style="background:'+avBg(p.id)+';width:26px;height:26px;font-size:11px">'+ini(p.name)+'</div>';
    h+='<span style="flex:1;font-size:13px;font-weight:600">'+esc(p.name)+'</span>';
    h+='<button class="kb" data-kill="'+predStep+'" data-prey="'+p.id+'">&#128128; Kill</button>';
    h+='</div>';
  });
  h+='<button id="pred-back" class="btn-ghost" style="width:100%;margin-top:10px;padding:10px;font-size:13px">&#8592; Voltar</button>';
  return h;
}
function wirePredator() {
  document.querySelectorAll('[data-pred]').forEach(function(btn){
    btn.addEventListener('click',function(){
      predStep=+this.dataset.pred;
      var box=document.getElementById('pred-box');
      if(box) box.innerHTML='<div class="sc-title">&#9876; Registrar Kill</div>'+predStepHTML();
      wirePredator();
    });
  });
  document.querySelectorAll('[data-kill]').forEach(function(btn){
    btn.addEventListener('click',function(){
      recordKill(+this.dataset.kill,+this.dataset.prey);
      predStep=null; renderPredator();
    });
  });
  var pb=document.getElementById('pred-back');
  if(pb) pb.addEventListener('click',function(){predStep=null;renderPredator();});
  document.querySelectorAll('[data-remkill]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=this.dataset.remkill;
      T().events=T().events.filter(function(ev){return ev.id!==id;});
      save(); renderPredator();
    });
  });
}

function renderRanking() {
  var t=T(); if(!t) return;
  var ps=t.players, rk=t.ranking, total=ps.length;
  var active=ps.filter(function(p){return rk.indexOf(p.id)<0;});
  var winner=(rk.length===total-1&&total>0)?ps.find(function(p){return rk.indexOf(p.id)<0;}):null;
  var h='<div class="pad">';
  if(winner){
    h+='<div style="background:linear-gradient(135deg,#c9a22730,#c9a22710);border:2px solid var(--gold);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px">';
    h+='<div style="font-size:36px">&#127942;</div>';
    h+='<div style="font-family:var(--fs);font-size:26px;color:var(--gold);margin-top:4px">'+esc(winner.name)+'</div>';
    h+='<div style="font-size:14px;color:var(--muted);margin-top:4px">Campe&#227;o da noite!</div></div>';
  }
  if(active.length){
    h+='<div class="sc"><div class="sc-title">&#127919; Jogadores Ativos</div>';
    h+='<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Toque para marcar elimina&#231;&#227;o definitiva</div>';
    h+='<div class="g2">';
    active.forEach(function(p){
      h+='<button class="rkb" data-elim="'+p.id+'">';
      h+='<div class="av" style="background:'+avBg(p.id)+';width:30px;height:30px">'+ini(p.name)+'</div>';
      h+=esc(p.name)+'</button>';
    });
    h+='</div></div>';
  }
  if(rk.length){
    h+='<div class="sc"><div class="sc-title">&#127885; Classifica&#231;&#227;o</div>';
    rk.slice().reverse().forEach(function(id){
      var p=ps.find(function(x){return x.id===id;});
      var place=total-rk.indexOf(id);
      var bg=place===2?'#aaa':place===3?'#cd7f32':'var(--s2)';
      var co=place<=3?'#000':'var(--muted)';
      var medal=['&#129351;','&#129352;','&#129353;'];
      var lbl=place<=3?medal[place-1]:place+'&#186;';
      h+='<div class="rkr">';
      h+='<div class="rkm" style="background:'+bg+';color:'+co+';font-size:'+(place<=3?'18px':'13px')+'">'+lbl+'</div>';
      h+='<span style="flex:1;font-weight:600">'+esc(p?p.name:'')+'</span>';
      h+='<button class="tag td" style="font-size:10px" data-undo-elim="'+id+'">desfazer</button>';
      h+='</div>';
    });
    h+='</div>';
  }
  if(!ps.length) h+='<div class="home-empty">Adicione jogadores na aba Setup primeiro</div>';
  h+='</div>';
  document.getElementById('tab-content').innerHTML=h;
  document.querySelectorAll('[data-elim]').forEach(function(btn){
    btn.addEventListener('click',function(){finalEliminate(+this.dataset.elim);renderRanking();});
  });
  document.querySelectorAll('[data-undo-elim]').forEach(function(btn){
    btn.addEventListener('click',function(){finalEliminate(+this.dataset.undoElim);renderRanking();});
  });
}

var editCons=false;
function renderConsumption() {
  var t=T(); if(!t) return;

  h+='<div class="sc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';

      h+='</div>';
    });
    h+='<div class="item-edit-row" style="margin-top:8px">';
    h+='<input class="fi" id="ni-e" placeholder="Emoji" style="width:44px;text-align:center;padding:7px">';
    h+='<input class="fi" id="ni-n" placeholder="Nome..." style="flex:1">';
    h+='<input class="fi" type="number" id="ni-p" placeholder="R$" style="width:68px">';
    h+='<button class="btn-gold" id="btn-add-item" style="padding:7px 14px;font-size:18px">+</button>';
    h+='</div>';
  }else{
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    its.forEach(function(it){h+='<div class="tag tm">'+esc(it.e)+' '+esc(it.n)+' &#8212; '+brl(it.p)+'</div>';});
    h+='</div>';
  }
  h+='</div>';
  // Per player
  ps.forEach(function(p){
    var dr=plDr(p);
    h+='<div class="sc"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
    h+='<div style="display:flex;align-items:center;gap:8px"><div class="av" style="background:'+avBg(p.id)+'">'+ini(p.name)+'</div><span style="font-weight:700">'+esc(p.name)+'</span></div>';
    h+='<div style="display:flex;align-items:center;gap:8px"><span class="mono tg" style="font-weight:700">'+brl(dr)+'</span>';
    if(dr>0) h+='<button class="tag '+(p.drinksPaid?'ts':'td')+'" data-dpaid="'+p.id+'">'+(p.drinksPaid?'&#10003; Pago':'&#10007; Aberto')+'</button>';
    h+='</div></div>';
    h+='<div class="dg">';
    its.forEach(function(it){
      h+='<div class="di">';
      h+='<span style="font-size:18px">'+esc(it.e)+'</span>';
      h+='<div style="flex:1;min-width:0"><div style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.n)+'</div>';
      h+='<div class="mono" style="font-size:12px;font-weight:700">'+(p.drinks[it.id]||0)+'&#215;</div></div>';
      h+='<div style="display:flex;flex-direction:column;gap:3px">';
      h+='<button class="db dbp" data-dadd="'+p.id+'" data-diid="'+it.id+'">+</button>';
      h+='<button class="db dbm" data-drem="'+p.id+'" data-diid2="'+it.id+'">&#8722;</button>';
      h+='</div></div>';
    });
    h+='</div></div>';
  });
  if(!ps.length) h+='<div class="home-empty">Adicione jogadores na aba Setup primeiro</div>';
  h+='</div>';
  document.getElementById('tab-content').innerHTML=h;
  // Wire consumption events
  document.getElementById('btn-edit-cons').addEventListener('click',function(){editCons=!editCons;renderConsumption();});
  if(editCons){
    document.querySelectorAll('[data-ie-e]').forEach(function(inp){
      inp.addEventListener('input',function(){
        var id=+this.dataset.ieE, it=T().items.find(function(x){return x.id===id;});
        if(it){it.e=this.value;save();}
      });
    });
    document.querySelectorAll('[data-ie-n]').forEach(function(inp){
      inp.addEventListener('input',function(){
        var id=+this.dataset.ieN, it=T().items.find(function(x){return x.id===id;});
        if(it){it.n=this.value;save();}
      });
    });
    document.querySelectorAll('[data-ie-p]').forEach(function(inp){
      inp.addEventListener('input',function(){
        var id=+this.dataset.ieP, it=T().items.find(function(x){return x.id===id;});
        if(it){it.p=+this.value;save();}
      });
    });
    document.querySelectorAll('[data-remitem]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=+this.dataset.remitem;
        T().items=T().items.filter(function(x){return x.id!==id;});
        save(); renderConsumption();
      });
    });
    var addBtn=document.getElementById('btn-add-item');
    if(addBtn) addBtn.addEventListener('click',function(){
      var e=document.getElementById('ni-e').value||'?';
      var n=document.getElementById('ni-n').value;
      var p=+document.getElementById('ni-p').value;
      if(!n||!p) return;
      T().items.push({id:Date.now(),e:e,n:n,p:p});
      save(); renderConsumption();
    });
  }
  document.querySelectorAll('[data-dpaid]').forEach(function(btn){
    btn.addEventListener('click',function(){toggleDrinksPaid(+this.dataset.dpaid);renderConsumption();});
  });
  document.querySelectorAll('[data-dadd]').forEach(function(btn){
    btn.addEventListener('click',function(){addDrink(+this.dataset.dadd,+this.dataset.diid);renderConsumption();});
  });
  document.querySelectorAll('[data-drem]').forEach(function(btn){
    btn.addEventListener('click',function(){remDrink(+this.dataset.drem,+this.dataset.diid2);renderConsumption();});
  });
}

    if(rem.length){S.activeId=rem[0];updateHeader();setTab(0);} else goHome();
  });
  document.getElementById('btn-new-from-set').addEventListener('click',function(){openNewTournamentModal();});
  document.querySelectorAll('[data-switch]').forEach(function(el){
    if(!el.dataset.switch) return;
    el.addEventListener('click',function(){
      S.activeId=this.dataset.switch; predStep=null; editCons=false;
      updateHeader(); setTab(0);
    });
  });
}

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
var RENDERERS=[renderTimer,renderSetup,renderRebuys,renderFinance,renderBestHand,renderPredator,renderRanking,renderConsumption,renderSettings];
function setTab(n) {
  S.tab=n;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',+b.dataset.tab===n);});
  RENDERERS[n]();
}
function updateHeader() {
  var t=T(); if(!t) return;
  document.getElementById('hdr-sub').textContent=t.name+' · '+t.date+' · '+(S.dealerName||'Dealer');
}
function openTournament(id) {
  S.activeId=id; predStep=null; editCons=false;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  updateHeader(); setTab(0);
}
function goHome() {
  pauseTimer();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderHome();
}

// ═══════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════
function renderHome() {
  var ids=Object.keys(S.tournaments).sort(function(a,b){
    return S.tournaments[b].createdAt>S.tournaments[a].createdAt?1:-1;
  });
  var list=document.getElementById('trn-list'), empty=document.getElementById('home-empty');
  if(!ids.length){list.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');
  list.innerHTML=ids.map(function(id){
    var t=S.tournaments[id];
    return '<div class="trn-card" data-open="'+id+'"><div class="trn-chip">'+((t.name||'?')[0].toUpperCase())+'</div>'+
      '<div class="trn-info"><div class="trn-name">'+esc(t.name)+'</div><div class="trn-meta">'+t.date+' · '+t.players.length+' jog. · '+t.events.length+' eventos</div></div>'+
      '<button class="trn-del" data-del="'+id+'">&#128465;</button></div>';
  }).join('');
  document.getElementById('dealer-input').value=S.dealerName;
  document.querySelectorAll('[data-open]').forEach(function(el){
    el.addEventListener('click',function(){openTournament(this.dataset.open);});
  });
  document.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var id=this.dataset.del;
      if(confirm('Excluir "'+S.tournaments[id].name+'"?')) deleteTournament(id);
    });
  });
}

// ═══════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════
function openNewTournamentModal() {
  var d=new Date().toLocaleDateString('pt-BR');
  document.getElementById('modal-box').innerHTML=
    '<div class="modal-title">&#127183; Novo Torneio</div>'+
    '<div class="mf"><div class="fl">Nome</div><input class="fi" id="m-name" value="FPC – Quinta Feira"></div>'+
    '<div class="mf"><div class="fl">Data</div><input class="fi" id="m-date" value="'+d+'"></div>'+
    '<div class="g2" style="margin-bottom:14px;gap:10px">'+
    '<div><div class="fl">Buy-in (R$)</div><input class="fi" id="m-bi" type="number" value="100"></div>'+
    '<div><div class="fl">Re-buy Comum</div><input class="fi" id="m-rc" type="number" value="50"></div>'+
    '<div><div class="fl">Re-buy B&#244;nus</div><input class="fi" id="m-rb" type="number" value="80"></div>'+
    '<div><div class="fl">Add-on</div><input class="fi" id="m-ao" type="number" value="60"></div>'+
    '</div>'+
    '<div class="mac">'+
    '<button class="btn-ghost" id="m-cancel">Cancelar</button>'+
    '<button class="btn-gold" id="m-create">Criar &#8594;</button>'+
    '</div>';
  document.getElementById('modal-bg').classList.remove('hidden');
  document.getElementById('m-cancel').addEventListener('click',closeModal);
  document.getElementById('m-create').addEventListener('click',function(){
    var name=(document.getElementById('m-name').value||'').trim();
    if(!name){alert('Preencha o nome.');return;}
    var id=newTournament(name,
      document.getElementById('m-date').value||'',
      document.getElementById('m-bi').value||100,
      document.getElementById('m-rc').value||50,
      document.getElementById('m-rb').value||80,
      document.getElementById('m-ao').value||60
    );
    closeModal(); openTournament(id);
  });
}
function closeModal() { document.getElementById('modal-bg').classList.add('hidden'); }

// ═══════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════
function openExport() {
  var t=T(); if(!t) return;
  var lines=['FPC MANAGER - LOG DO TORNEIO',
    'Torneio: '+t.name, 'Data: '+t.date, 'Dealer: '+(S.dealerName||'N/A'),
    'Jogadores: '+t.players.map(function(p){return p.name;}).join(', '),
    '---', 'EVENTOS ('+t.events.length+'):', ''];
  t.events.slice().sort(function(a,b){return a.at-b.at;}).forEach(function(ev){
    var d='';
    switch(ev.type){
      case 'rebuy_common': d='RE-BUY COMUM x'+ev.data.count+' - '+ev.data.name; break;
      case 'rebuy_bonus':  d='RE-BUY BONUS x'+ev.data.count+' - '+ev.data.name; break;
      case 'addon':        d='ADD-ON - '+ev.data.name+' ('+(ev.data.taken?'PEGOU':'DEVOLVEU')+')'; break;
      case 'kill':         d='KILL - '+ev.data.predName+' eliminou '+ev.data.preyName; break;
      case 'final_elim':   d='RANKING - '+ev.data.name+' -> '+ev.data.place+'o lugar'; break;
      case 'best_hand':    d='MELHOR MAO - '+ev.data.playerName+': '+ev.data.handType; break;
      default:             d=ev.type;
    }
    lines.push(ev.ts+' | '+d);
  });
  lines.push('','---');
  if(t.ranking.length){
    lines.push('CLASSIFICACAO FINAL:');
    var total=t.players.length;
    t.ranking.slice().reverse().forEach(function(id){
      var p=t.players.find(function(x){return x.id===id;});
      var place=total-t.ranking.indexOf(id);
      lines.push('  '+place+'o - '+(p?p.name:''));
    });
    var win=t.players.find(function(p){return t.ranking.indexOf(p.id)<0;});
    if(win) lines.push('  1o - '+win.name+' CAMPEAO');
  }
  lines.push('---','Gerado: '+new Date().toLocaleString('pt-BR'),'FPC Manager - Fundadores Poker Club');
  document.getElementById('exp-txt').textContent=lines.join('\n');
  document.getElementById('exp-bg').classList.remove('hidden');
}
function closeExport() { document.getElementById('exp-bg').classList.add('hidden'); }
function copyExport() {
  var text=document.getElementById('exp-txt').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){alert('Copiado! Cole no WhatsApp.');});
  }else{
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);alert('Copiado!');
  }
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded',function(){
  loadData();
  renderHome();

  document.getElementById('dealer-input').addEventListener('input',function(){
    S.dealerName=this.value; save();
  });
  document.getElementById('btn-new-trn').addEventListener('click',function(){
    openNewTournamentModal();
  });
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click',function(){setTab(+this.dataset.tab);});
  });
  document.getElementById('btn-home').addEventListener('click',goHome);
  document.getElementById('btn-export').addEventListener('click',openExport);
  document.getElementById('btn-close-exp').addEventListener('click',closeExport);
  document.getElementById('btn-close-exp2').addEventListener('click',closeExport);
  document.getElementById('btn-copy-exp').addEventListener('click',copyExport);
  document.getElementById('modal-bg').addEventListener('click',function(e){
    if(e.target===this) closeModal();
  });
  document.getElementById('exp-bg').addEventListener('click',function(e){
    if(e.target===this) closeExport();
  });
});
</script>
